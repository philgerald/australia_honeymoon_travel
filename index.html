<style>
/* Layout: quiet travel booklet — plain header, text tab bar, sections separated by space and hairlines, one 760px column */
:root {
  --bg: #f4fafd;
  --surface: #ffffff;
  --ink: #1d2b33;
  --sub: #5a6b74;
  --line: #d8e8ef;
  --accent: #0a8bc2;      /* sunny harbour blue */
  --accent-soft: #e0f3fb;
  --gum: #22a065;         /* fresh eucalyptus */
  --gum-soft: #e0f6ea;
  --warn: #d9690b;        /* wattle orange */
  --warn-soft: #fff3e0;
  --sun: #ffc93c;
  --on-accent: #ffffff;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.65; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; }

header { padding-block: 30px 22px; background: linear-gradient(120deg, #d9f2fc 0%, #e6f8ee 60%, #fff6dc 100%); border-bottom: 3px solid var(--sun); }
.eyebrow { font-size: .78rem; letter-spacing: .12em; color: var(--accent); font-weight: 700; }
h1 { font-family: var(--serif); font-weight: 600; font-size: 1.75rem; margin: 4px 0 2px; text-wrap: balance; }
.header-sub { color: var(--sub); font-size: .92rem; }

nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 1000; background: var(--surface); border-bottom: 1px solid var(--line); }
nav .wrap { display: flex; gap: 4px; overflow-x: auto; }
nav button { flex: 0 0 auto; padding: 11px 12px; border: 0; background: none; color: var(--sub); font: inherit; font-size: .94rem; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
nav button.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { padding-block: 8px 40px; }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-top: 16px; }
.block > h2 { font-size: 1.02rem; margin: 0 0 4px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
.block > .lead { color: var(--sub); font-size: .88rem; margin: 0 0 10px; }
.block.note { background: var(--warn-soft); border-color: transparent; }
.block.note h2 { color: var(--warn); }
.muted { color: var(--sub); font-size: .86rem; }
.tag { font-size: .74rem; font-weight: 600; padding: 1px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.tag.gum { background: var(--gum-soft); color: var(--gum); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
ul.plain { margin: 0; padding-left: 1.1em; }
ul.plain li { padding: 3px 0; }

.btn { display: inline-flex; align-items: center; min-height: 38px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--accent); font: inherit; font-size: .9rem; font-weight: 600; text-decoration: none; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

.row { display: grid; grid-template-columns: 5.2em 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row .k { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; font-size: .9rem; }
.row .v { min-width: 0; }
.row .n { display: block; color: var(--sub); font-size: .85rem; }

/* today */
.today-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.today-num { font-family: var(--serif); font-size: 2.1rem; font-weight: 600; color: var(--accent); line-height: 1.2; }
.check { display: grid; grid-template-columns: 22px 4.4em 1fr; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.check:first-child { border-top: 0; }
.check input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--accent); }
.check .k { color: var(--accent); font-weight: 600; font-size: .9rem; font-variant-numeric: tabular-nums; }
.check.done .v { color: var(--sub); text-decoration: line-through; }
.check .n { display: block; color: var(--sub); font-size: .85rem; text-decoration: none; }
ul.bare { list-style: none; margin: 0; padding: 0; }

/* prep */
.meter { display: flex; align-items: center; gap: 12px; }
.bar { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--gum); transition: width .2s; }
.prep { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.prep:first-child { border-top: 0; }
.prep input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--gum); }
.prep.done .t { color: var(--sub); text-decoration: line-through; }
.prep .t { font-weight: 600; }

/* overview */
.flight { display: grid; grid-template-columns: 1fr auto 1fr; gap: 4px 10px; align-items: end; padding: 12px 0; border-top: 1px solid var(--line); }
.flight:first-of-type { border-top: 0; }
.flight .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; font-size: .88rem; }
.ft { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.arrow { color: var(--sub); padding-bottom: 18px; }
.flight .r { text-align: right; }
.hotel { padding: 12px 0; border-top: 1px solid var(--line); }
.hotel:first-of-type { border-top: 0; }
.hotel h3 { font-size: .98rem; margin: 0 0 6px; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
dl.kv { display: grid; grid-template-columns: 5.5em 1fr; gap: 2px 12px; margin: 0; font-size: .88rem; }
dl.kv dt { color: var(--sub); }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px 8px 0; border-top: 1px solid var(--line); }
th { color: var(--sub); font-weight: 600; border-top: 0; white-space: nowrap; }
td.nw { white-space: nowrap; font-variant-numeric: tabular-nums; }
.leg-day { margin: 14px 0 2px; font-weight: 600; font-size: .9rem; }
.leg { display: grid; grid-template-columns: 3.4em 1fr; gap: 10px; padding: 6px 0; font-size: .9rem; }
.leg .n { display: block; color: var(--sub); font-size: .85rem; }

/* itinerary */
.dates { display: flex; gap: 6px; overflow-x: auto; padding-block: 14px 2px; }
.dates button { flex: 0 0 auto; display: grid; justify-items: center; min-width: 52px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; }
.dates button small { color: var(--sub); font-size: .72rem; }
.dates button b { font-variant-numeric: tabular-nums; font-size: .92rem; }
.dates button.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.dates button.active small { color: var(--on-accent); opacity: .85; }

/* map */
.seg { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.seg button { padding: 5px 12px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); color: var(--ink); font: inherit; font-size: .86rem; cursor: pointer; }
.seg button.active { border-color: var(--accent); color: var(--accent); font-weight: 600; background: var(--accent-soft); }
.map { height: 58vh; min-height: 340px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--accent-soft); }
.pin { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font: 700 12px/1 var(--sans); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.pin.stay { background: var(--gum); }
.leaflet-popup-content { font-family: var(--sans); font-size: 13px; }
.poi { display: grid; grid-template-columns: 1.8em 1fr auto; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); font-size: .9rem; }
.poi:first-child { border-top: 0; }
.num { display: inline-grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: 50%; font-size: .74rem; font-weight: 700; color: var(--on-accent); background: var(--accent); }
.num.stay { background: var(--gum); }
.poi a { color: var(--accent); font-size: .85rem; font-weight: 600; text-decoration: none; white-space: nowrap; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; }

/* help */
.phones { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.phone { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
.phone strong { display: block; font-size: 1.2rem; font-variant-numeric: tabular-nums; color: var(--ink); user-select: all; }
.phone.em strong { color: var(--warn); }
.contact { padding: 10px 0; border-top: 1px solid var(--line); }
.contact:first-child { border-top: 0; }
.tel { font-variant-numeric: tabular-nums; user-select: all; }
.copy-status { min-height: 1.4em; color: var(--gum); font-weight: 600; font-size: .86rem; margin-top: 6px; }

footer { color: var(--sub); font-size: .82rem; padding-block: 0 32px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

/* 今日 */
function dateIn(tz) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en", { timeZone: tz, year: "numeric", month: "numeric", day: "numeric" }).formatToParts(new Date()).filter((x) => x.type !== "literal").map((x) => [x.type, Number(x.value)]));
  return Date.UTC(p.year, p.month - 1, p.day);
}
function tripState() {
  const stamps = TRIP.days.map((d) => { const [m, dd] = d.date.split("/").map(Number); return Date.UTC(2026, m - 1, dd); });
  const au = dateIn("Australia/Sydney"), tw = dateIn("Asia/Taipei");
  const inAus = au >= stamps[1] && au <= stamps[11];
  const today = inAus ? au : tw;
  const idx = stamps.indexOf(today);
  if (idx >= 0) return { i: idx, mode: "today", tz: inAus ? "澳洲時間" : "台灣時間" };
  if (today < stamps[0]) return { i: 0, mode: "before", days: Math.round((stamps[0] - today) / 86400000) };
  return { i: TRIP.days.length - 1, mode: "after" };
}
function renderToday() {
  const st = tripState(), d = TRIP.days[st.i];
  const head = st.mode === "before"
    ? `<div class="today-head"><span class="today-num">${st.days} 天</span><span>後出發</span></div><p class="muted" style="margin:4px 0 0">10/14（三）20:30 從家出發，23:30 搭 CI051。</p>`
    : st.mode === "today"
      ? `<div class="today-head"><span class="today-num">Day ${st.i + 1}</span><span>${esc(d.date)}（${esc(d.wd)}）${esc(d.label)}</span></div><p class="muted" style="margin:4px 0 0">以${st.tz}為準</p>`
      : `<div class="today-head"><span class="today-num">新婚快樂</span></div><p class="muted" style="margin:4px 0 0">旅程已結束。</p>`;
  const pending = TRIP.prep.flatMap((c) => c.items.map((it) => ({ c, it }))).filter(({ c, it }) => store.get(`hm:prep:${c.id}:${it.id}`) !== "1");
  $("#tab-today").innerHTML = `
    <div class="block">${head}
      <div class="actions"><button class="btn primary" type="button" id="go-day">看當天完整行程</button>${st.mode === "before" ? `<button class="btn" type="button" id="go-prep">準備清單（還有 ${pending.length} 項）</button>` : ""}</div></div>
    <div class="block"><h2>${st.mode === "today" ? "今日待辦" : `第一天：${esc(d.date)}（${esc(d.wd)}）${esc(d.label)}`}</h2>
      <p class="lead">打勾只會記在這支手機。</p>
      <ul class="bare">${d.items.map((it, j) => {
        const k = `hm:done:${st.i}:${j}`, on = store.get(k) === "1";
        return `<li class="check${on ? " done" : ""}"><input type="checkbox" id="c-${st.i}-${j}" data-k="${k}" ${on ? "checked" : ""} aria-label="完成 ${esc(it[1])}"><span class="k">${esc(it[0])}</span><span class="v">${esc(it[1])}${sub(it[2])}</span></li>`;
      }).join("")}</ul></div>`;
  $("#go-day").addEventListener("click", () => { showDay(st.i); switchTab("itinerary"); });
  const gp = $("#go-prep"); if (gp) gp.addEventListener("click", () => switchTab("prep"));
  document.querySelectorAll(".check input").forEach((c) => c.addEventListener("change", () => { store.set(c.dataset.k, c.checked ? "1" : "0"); c.closest(".check").classList.toggle("done", c.checked); }));
}

}

let region = "syd", lmap = null, layer = null;
function renderMap() {
  const seg = $("#seg");
  seg.innerHTML = TRIP.regions.map((r) => `<button type="button" data-r="${r.id}" class="${r.id === region ? "active" : ""}">${esc(r.name)}</button>`).join("");
  seg.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { region = b.dataset.r; renderMap(); }));
  const pts = TRIP.pois.filter((p) => p.r === region);
  $("#poi-list").innerHTML = pts.map((p, i) => `<li class="poi"><span class="num${p.stay ? " stay" : ""}">${i + 1}</span><span>${esc(p.name)} <span class="muted">${esc(p.note)}</span></span><a href="${gmap(p)}" target="_blank" rel="noopener noreferrer">導航</a></li>`).join("");
  if (!window.L || $("#tab-map").hidden) return;
  if (!lmap) {
    lmap = L.map("map", { scrollWheelZoom: false });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(lmap);
  }
  lmap.invalidateSize();
  if (layer) layer.remove();
  layer = L.layerGroup(pts.map((p, i) => L.marker([p.lat, p.lng], {
    icon: L.divIcon({ className: "", html: `<div class="pin${p.stay ? " stay" : ""}">${i + 1}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] })
  }).bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.note)}<br><a href="${gmap(p)}" target="_blank" rel="noopener noreferrer">Google 地圖導航 →</a>`))).addTo(lmap);
  lmap.fitBounds(pts.map((p) => [p.lat, p.lng]), { padding: [30, 30], maxZoom: 15 });
}

async function copyText(text, label) {
  let ok = true;
  try { await navigator.clipboard.writeText(text); } catch (e) {
    try { const t = document.createElement("textarea"); t.value = text; t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select(); ok = document.execCommand("copy"); t.remove(); } catch (e2) { ok = false; }
  }
  const s = $("#copy-status"); s.textContent = ok ? `已複製${label}` : "無法自動複製，請長按號碼選取"; setTimeout(() => s.textContent = "", 2000);
}

/* 分頁 */
function switchTab(name) {
  document.querySelectorAll("nav button").forEach((b) => { const on = b.dataset.tab === name; b.classList.toggle("active", on); b.setAttribute("aria-selected", String(on)); });
  document.querySelectorAll("section.tab").forEach((s) => s.hidden = s.id !== "tab-" + name);
  store.set("hm:tab", name);
  if (name === "map") setTimeout(renderMap, 50);
}
document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => { switchTab(b.dataset.tab); window.scrollTo({ top: 0 }); }));

showDay(tripState().i);

renderPrep();
renderToday();
renderHelp();
const saved = store.get("hm:tab");
if (saved && document.getElementById("tab-" + saved)) switchTab(saved);
